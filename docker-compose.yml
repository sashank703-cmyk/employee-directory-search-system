services:
  db:
    image: mysql:8.4
    container_name: employee-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-ChangeThisRootPassword123!}"
      MYSQL_DATABASE: employee_directory
      MYSQL_USER: employee_user
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-ChangeThisAppPassword123!}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - employee-network
 
  backend:
    build:
      context: ./backend
    container_name: employee-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: employee_user
      DB_PASSWORD: "${MYSQL_PASSWORD:-ChangeThisAppPassword123!}"
      DB_NAME: employee_directory
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - employee-network
 
  frontend:
    build:
      context: ./frontend
    container_name: employee-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - employee-network
 
volumes:
  mysql_data:
 
networks:
  employee-network:
    driver: bridge
 
